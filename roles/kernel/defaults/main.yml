---
# ---- sysctl (SC-39 process isolation, SI-16 memory protection, SC-7, SC-5) ----
kernel_ptrace_scope: 1          # 1 = only descendants; 2 = admin only (breaks some debuggers)
kernel_ip_forward: 0            # set 1 on images destined for routers/k8s nodes
kernel_restrict_user_namespaces: false  # true breaks rootless containers; enable for non-container hosts

kernel_sysctl:
  # --- kernel self-protection ---
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  kernel.printk: "3 3 3 3"
  kernel.randomize_va_space: 2
  kernel.yama.ptrace_scope: "{{ kernel_ptrace_scope }}"
  kernel.unprivileged_bpf_disabled: 1
  net.core.bpf_jit_harden: 2
  kernel.kexec_load_disabled: 1
  kernel.sysrq: 0
  kernel.perf_event_paranoid: 3
  kernel.io_uring_disabled: 2     # ignored on kernels < 6.6
  kernel.core_uses_pid: 1
  kernel.core_pattern: "|/bin/false"
  kernel.panic: 10
  kernel.panic_on_oops: 1
  dev.tty.ldisc_autoload: 0
  vm.unprivileged_userfaultfd: 0
  vm.mmap_min_addr: 65536
  # --- filesystem ---
  fs.protected_symlinks: 1
  fs.protected_hardlinks: 1
  fs.protected_fifos: 2
  fs.protected_regular: 2
  fs.suid_dumpable: 0
  # --- network (IPv4) ---
  net.ipv4.ip_forward: "{{ kernel_ip_forward }}"
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.conf.all.arp_ignore: 1
  net.ipv4.conf.all.arp_announce: 2
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv4.tcp_rfc1337: 1
  net.ipv4.tcp_timestamps: 1
  net.ipv4.tcp_sack: 1
  # --- network (IPv6) ---
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.default.accept_ra: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  net.ipv6.conf.all.forwarding: 0
  net.ipv6.conf.all.use_tempaddr: 2
  net.ipv6.conf.default.use_tempaddr: 2

# Extra/override entries merged on top of kernel_sysctl.
kernel_sysctl_extra: {}

# ---- kernel module denylist (CM-7, SC-41) ----
kernel_module_denylist:
  # exotic / unmaintained filesystems
  - cramfs
  - freevxfs
  - jffs2
  - hfs
  - hfsplus
  - squashfs
  - udf
  # (vfat stays loadable: EFI system partition)
  # network protocols rarely needed on servers
  - dccp
  - sctp
  - rds
  - tipc
  - n-hdlc
  - ax25
  - netrom
  - x25
  - rose
  - decnet
  - econet
  - af_802154
  - ipx
  - appletalk
  - psnap
  - p8023
  - p8022
  - can
  - atm
  # hardware busses that enable DMA / physical attacks
  - firewire-core
  - firewire-ohci
  - firewire-sbp2
  - thunderbolt
  - bluetooth
  - btusb
  - usb-storage
  - uas
  - cifs
  - nfs
  - nfsv3
  - nfsv4
  - ksmbd
  - gfs2
  - vivid
kernel_module_denylist_extra: []

# ---- kernel command line (SI-16, AU-12, SC-39) ----
kernel_cmdline_args:
  - "audit=1"
  - "audit_backlog_limit=8192"
  - "init_on_alloc=1"
  - "init_on_free=1"
  - "page_alloc.shuffle=1"
  - "slab_nomerge"
  - "randomize_kstack_offset=on"
  - "vsyscall=none"
  - "debugfs=off"
  - "pti=on"
  - "mitigations=auto"
  - "lockdown={{ kernel_lockdown_mode | default('integrity') }}"
  - "oops=panic"
kernel_cmdline_args_extra: []
# Applied only on bare metal (ansible_virtualization_role != guest): DMA
# protection for PCIe/Thunderbolt. Hypervisors without a vIOMMU may not boot with these.
kernel_cmdline_args_baremetal:
  - "iommu=force"
  - "iommu.passthrough=0"
  - "iommu.strict=1"
# Disable SMT to close cross-thread side channels (halves logical CPUs).
kernel_disable_smt: false
# Require signed modules. Safe on RHEL/Ubuntu stock kernels; breaks unsigned DKMS.
kernel_module_sig_enforce: false
# Append "ipv6.disable=1" and skip IPv6 sysctls.
kernel_disable_ipv6: false

# ---- crypto (SC-13) ----
# RHEL system-wide crypto policy: DEFAULT, DEFAULT:NO-SHA1, FUTURE, FIPS
kernel_crypto_policy: "DEFAULT:NO-SHA1"
kernel_fips_enabled: false
# Ubuntu FIPS requires Ubuntu Pro attachment (`pro attach`) before enabling.
kernel_ubuntu_pro_token: ""

# ---- core dumps (SI-16 / SC-28: no memory contents on disk) ----
kernel_disable_coredumps: true
