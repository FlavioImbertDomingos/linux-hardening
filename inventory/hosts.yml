---
# Image-build inventory. Packer/CI normally generates this dynamically; these
# entries document the expected shape. One host per image being built.
all:
  children:
    image_builders:
      hosts:
        rhel9-image:
          ansible_host: 10.0.0.11
          ansible_user: builder
          image_name: base-rhel9
        rhel8-image:
          ansible_host: 10.0.0.12
          ansible_user: builder
          image_name: base-rhel8
        ubuntu2404-image:
          ansible_host: 10.0.0.13
          ansible_user: builder
          image_name: base-ubuntu2404
        ubuntu2204-image:
          ansible_host: 10.0.0.14
          ansible_user: builder
          image_name: base-ubuntu2204
