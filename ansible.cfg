[defaults]
ansible_managed = Managed by linux-hardening (Ansible) — do not edit by hand. Source: {file}
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections:~/.ansible/collections
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
stdout_callback = ansible.builtin.default
callback_result_format = yaml
forks = 10
timeout = 30
# Never log secrets (cosign keys, TLS material) to stdout/journal
no_log = False
display_skipped_hosts = False
deprecation_warnings = False
# Keep controller-side artefacts (SBOMs, scan reports) out of the repo tree
local_tmp = ~/.ansible/tmp

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
