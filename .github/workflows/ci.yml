---
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ansible-lint (production profile) + syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible ansible-lint yamllint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint .
      - run: ansible-lint
      - run: ansible-playbook --syntax-check playbooks/harden-image.yml
      - run: ansible-playbook --syntax-check playbooks/verify.yml

  render:
    name: render templates and validate with real parsers
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openssh-server sudo nftables rsyslog auditd python3-yaml
      - run: pip install ansible
      - run: ansible-galaxy collection install -r requirements.yml
      - run: RENDER_OUT=/tmp/render ansible-playbook tests/render-templates.yml
      - run: sudo RENDER_OUT=/tmp/render bash tests/validate-rendered.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-configs
          path: /tmp/render

  packer:
    name: packer fmt + validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3
        with:
          version: latest
      - working-directory: packer
        env:
          # plugin downloads go through the GitHub API; unauthenticated runners hit the rate limit
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          packer init .
          packer validate -var image_version=ci ubuntu2404.pkr.hcl
          packer validate -var image_version=ci rhel9-aws.pkr.hcl
          # qemu template references a local SSH key; syntax check only in CI
          packer validate -syntax-only rhel9.pkr.hcl

  # Real image builds (VM + reboot + SBOM gate + OpenSCAP) are the manual
  # build-image.yml workflow (AWS via OIDC) or tests/local-vm.sh (Multipass).
