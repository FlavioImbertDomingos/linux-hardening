---
- name: Install logging packages
  ansible.builtin.package:
    name: "{{ ['rsyslog', 'rsyslog-gnutls', 'logrotate'] }}"
    state: present
  tags: [nist_AU-4]

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [nist_AU-4]

- name: Configure journald (AU-4 capacity, AU-9 protection, AU-11 retention)
  ansible.builtin.template:
    src: journald-hardening.conf.j2
    dest: /etc/systemd/journald.conf.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
  tags: [nist_AU-4, nist_AU-9, nist_AU-11]

- name: Ensure persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  tags: [nist_AU-4]

- name: Configure rsyslog hardening and forwarding
  ansible.builtin.template:
    src: rsyslog-hardening.conf.j2
    dest: /etc/rsyslog.d/00-hardening.conf
    owner: root
    group: root
    mode: "0640"
    validate: "rsyslogd -N1 -f %s"
  notify: Restart rsyslog
  tags: [nist_AU-4, nist_AU-9]

- name: Disable rsyslog network listeners (CM-7)
  ansible.builtin.replace:
    path: /etc/rsyslog.conf
    regexp: '^(\s*)(module\(load="im(udp|tcp)".*|input\(type="im(udp|tcp)".*|\$ModLoad im(udp|tcp).*|\$(UDP|InputTCP)ServerRun.*)$'
    replace: '\1#\2'
  notify: Restart rsyslog
  tags: [nist_CM-7]

- name: Enable rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: "{{ 'started' if not hardening_is_container | bool else omit }}"
  tags: [nist_AU-4]

- name: Configure logrotate retention (AU-11)
  ansible.builtin.template:
    src: logrotate-hardening.j2
    dest: /etc/logrotate.d/00-hardening
    owner: root
    group: root
    mode: "0644"
  tags: [nist_AU-11]

- name: Set global logrotate defaults
  ansible.builtin.lineinfile:
    path: /etc/logrotate.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^\s*#?\s*compress', line: "compress" }
    - { regexp: '^\s*create\b', line: "create 0640 root root" }
  loop_control:
    label: "{{ item.line }}"
  tags: [nist_AU-11]

- name: Restrict permissions on existing log files (AU-9)
  ansible.builtin.command: >-
    find /var/log -type f \( -perm /g+wx -o -perm /o+rwx \)
    ! -path '/var/log/journal/*' ! -name wtmp ! -name btmp ! -name lastlog ! -name 'sa*'
    -exec chmod g-wx,o-rwx {} +
  changed_when: true
  tags: [nist_AU-9]

- name: Ensure sudo log exists with tight permissions
  ansible.builtin.file:
    path: "{{ auth_sudo_logfile | default('/var/log/sudo.log') }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  tags: [nist_AU-9]
