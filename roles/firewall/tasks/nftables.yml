---
- name: Install nftables
  ansible.builtin.package:
    name: nftables
    state: present

- name: Remove competing firewall stacks
  ansible.builtin.package:
    name: [ufw, iptables-persistent, firewalld]
    state: absent

- name: Write nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0600"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
