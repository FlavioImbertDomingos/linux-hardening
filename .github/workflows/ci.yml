---
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ansible-lint (production profile) + syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible ansible-lint yamllint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint .
      - run: ansible-lint
      - run: ansible-playbook --syntax-check playbooks/harden-image.yml
      - run: ansible-playbook --syntax-check playbooks/verify.yml

  render:
    name: render templates and validate with real parsers
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openssh-server sudo nftables rsyslog auditd python3-yaml
      - run: pip install ansible
      - run: ansible-galaxy collection install -r requirements.yml
      - run: RENDER_OUT=/tmp/render ansible-playbook tests/render-templates.yml
      - run: sudo RENDER_OUT=/tmp/render bash tests/validate-rendered.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-configs
          path: /tmp/render

