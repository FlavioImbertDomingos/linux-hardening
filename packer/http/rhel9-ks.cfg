# Kickstart for the RHEL 9 base image — partition layout satisfies CIS 1.1.x /
# SSG partition_for_* rules so the filesystem role can apply nodev/nosuid/noexec.
text
lang en_US.UTF-8
keyboard us
timezone Etc/UTC --utc
network --bootproto=dhcp --device=link --activate --hostname=builder
rootpw --lock
user --name=builder --groups=wheel --lock
sshkey --username=builder "ssh-ed25519 AAAA...replace-with-packer-public-key"
selinux --enforcing
firewall --enabled --ssh
bootloader --location=mbr --append="audit=1 audit_backlog_limit=8192"
zerombr
clearpart --all --initlabel
reqpart --add-boot
part pv.01 --size=1 --grow
volgroup vg_sys pv.01
logvol /              --vgname=vg_sys --name=root     --size=8192 --fstype=xfs
logvol swap           --vgname=vg_sys --name=swap     --size=2048
logvol /home          --vgname=vg_sys --name=home     --size=2048 --fstype=xfs --fsoptions="nodev,nosuid"
logvol /var           --vgname=vg_sys --name=var      --size=6144 --fstype=xfs --fsoptions="nodev"
logvol /var/log       --vgname=vg_sys --name=var_log  --size=4096 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var/log/audit --vgname=vg_sys --name=var_audit --size=4096 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
logvol /var/tmp       --vgname=vg_sys --name=var_tmp  --size=2048 --fstype=xfs --fsoptions="nodev,nosuid,noexec"
%packages --excludedocs
@^minimal-environment
openssh-server
sudo
python3
cloud-init
-iwl*-firmware
-plymouth
%end
%post
echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
chmod 0440 /etc/sudoers.d/builder
%end
reboot
